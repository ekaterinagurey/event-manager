# PostgreSQL для EventApi, для BookingApi, UserApi — совпадает с ConnectionStrings:DefaultConnection в appsettings.json
# Запуск из корня репозитория: docker compose up -d
# Остановка: docker compose down
# Данные сохраняются в именованных томах:  eventapi_pgdata, userapi_pgdata, bookingapi_pgdata
services:
  # ─────────────────────────── Инфраструктура обмена сообщениями ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: eventapi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eventapi-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Внешний listener для подключения с хоста (например, из dotnet run локально).
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Два listener'а: INTERNAL — для сервисов внутри сети Docker, EXTERNAL — для хоста.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # ─────────────────────────── Базы данных (по одной на сервис) ───────────────────────────
  eventapi-postgres:
    image: postgres:16-alpine
    container_name: eventapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD}
      POSTGRES_DB: eventapi
    ports:
      - "5435:5432"
    volumes:
      - eventapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  userapi-postgres:
    image: postgres:16-alpine
    container_name: userapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: userapi
    ports:
      - "5433:5432"
    volumes:
      - userapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  bookingapi-postgres:
    image: postgres:16-alpine
    container_name: bookingapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD}
      POSTGRES_DB: bookingapi
    ports:
      - "5434:5432"
    volumes:
      - bookingapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookingapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Users Service (Порт 5001)
  # ==========================================
  users-service:
    build:
      context: ./EventManager
      dockerfile: Users/Dockerfile
    container_name: eventmanager-users
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=userapi-postgres;Port=5432;Database=userapi;Username=postgres;Password=postgres
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_that_is_long_enough_32_bytes}
      - Jwt__Issuer=${JWT_ISSUER:-EventManager}
      - Jwt__Audience=${JWT_AUDIENCE:-EventManager}

    # ==========================================
    # Evemt Service (Порт 5002)
    # ==========================================
  events-service:
    build:
      context: ./EventManager
      dockerfile: Events/Dockerfile
    container_name: eventmanager-events
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=eventapi-postgres;Port=5432;Database=eventapi;Username=postgres;Password=${EVENT_DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_that_is_long_enough_32_bytes}
      - Jwt__Issuer=${JWT_ISSUER:-EventManager}
      - Jwt__Audience=${JWT_AUDIENCE:-EventManager}
    depends_on:
      eventapi-postgres:
        condition: service_healthy

  bookings-service:
    build:
      context: ./EventManager
      dockerfile: Bookings/Dockerfile
    container_name: eventmanager-bookings
    restart: unless-stopped
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=bookingapi-postgres;Port=5432;Database=bookingapi;Username=postgres;Password=${BOOKING_DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_that_is_long_enough_32_bytes}
      - Jwt__Issuer=${JWT_ISSUER:-EventManager}
      - Jwt__Audience=${JWT_AUDIENCE:-EventManager}
    depends_on:
      bookingapi-postgres:
        condition: service_healthy

volumes:
  eventapi_pgdata:
  userapi_pgdata:
  bookingapi_pgdata: